# spike/duplex-test-v2.yaml
# Test i2s_audio_duplex from n-IA-hane/esphome-intercom.
# True duplex via single ESP-IDF I2S driver with TX+RX channels.
# Based on rmeissn's onju_duplex_i2s.yaml.

substitutions:
  name: onju-duplex-spike-v2
  friendly_name: "Onju Duplex Spike v2"

external_components:
  - source: github://n-IA-hane/esphome-intercom@main
    components: [i2s_audio_duplex, esp_aec]
    refresh: 0s

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio
    board_build.arduino.memory_type: qio_opi
  on_boot:
    priority: -100
    then:
      - delay: 3s
      - logger.log:
          level: INFO
          format: "=== DUPLEX SPIKE v2: Starting RTTTL (speaker) ==="
      - rtttl.play: "test:d=4,o=5,b=120:c,d,e,f,g,a,b,c6,c6,b,a,g,f,e,d,c"
      - delay: 1s
      - logger.log:
          level: INFO
          format: "=== DUPLEX SPIKE v2: Starting microphone ==="
      - microphone.capture:
          id: spike_mic
      - delay: 5s
      - logger.log:
          level: INFO
          format: "=== DUPLEX SPIKE v2: Test window complete ==="
      - microphone.stop_capture:
          id: spike_mic

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  logs:
    i2s_audio_duplex: DEBUG
    speaker: DEBUG
    microphone: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

# --- True duplex I2S via n-IA-hane component ---

i2s_audio_duplex:
  id: i2s_shared
  i2s_lrclk_pin: GPIO13
  i2s_bclk_pin: GPIO18
  i2s_din_pin: GPIO17
  i2s_dout_pin: GPIO12
  sample_rate: 48000
  output_sample_rate: 16000
  slot_bit_width: 32
  correct_dc_offset: true
  mic_channel: right
  buffers_in_psram: true

esp_aec:
  id: aec_processor
  sample_rate: 16000
  mode: sr_high_perf
  filter_length: 4

microphone:
  - platform: i2s_audio_duplex
    id: spike_mic
    i2s_audio_duplex_id: i2s_shared
    on_data:
      - lambda: |-
          static int count = 0;
          static uint32_t total_bytes = 0;
          count++;
          total_bytes += x.size();
          if (count <= 10 || count % 50 == 0) {
            ESP_LOGI("spike", "Mic callback #%d: %d bytes (total: %u)",
                     count, x.size(), total_bytes);
          }

speaker:
  - platform: i2s_audio_duplex
    id: spike_speaker
    i2s_audio_duplex_id: i2s_shared
    sample_rate: 48000

rtttl:
  id: spike_buzzer
  speaker: spike_speaker

# DAC unmute (active low on Onju Voice PCB)
switch:
  - platform: gpio
    id: dac_mute
    restore_mode: ALWAYS_OFF
    pin:
      number: GPIO21
      inverted: true
