# spike/duplex-test.yaml
# Minimal firmware to test I2S duplex via allow_other_uses at 48kHz.
# Flash to d20, check logs for simultaneous mic+speaker operation.
#
# Expected: mic captures audio data while speaker plays a test tone.
# Failure mode: "Parent I2S bus not free" or one device blocks the other.

substitutions:
  name: onju-duplex-spike
  friendly_name: "Onju Duplex Spike"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio
    board_build.arduino.memory_type: qio_opi
  on_boot:
    priority: -100
    then:
      - delay: 3s
      - logger.log:
          level: INFO
          format: "=== DUPLEX SPIKE: Starting speaker via RTTTL ==="
      - rtttl.play: "test:d=4,o=5,b=120:c,d,e,f,g,a,b,c6,c6,b,a,g,f,e,d,c"
      - delay: 10s
      - logger.log:
          level: INFO
          format: "=== DUPLEX SPIKE: RTTTL-only test complete (no mic) ==="

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_MODE_OCT: "y"
      CONFIG_SPIRAM_SPEED_80M: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: VERBOSE
  logs:
    i2s_audio: VERBOSE
    speaker: DEBUG
    microphone: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

# --- I2S duplex test: two bus instances on shared pins ---

i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin:
      number: GPIO13
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO18
      allow_other_uses: true
  - id: i2s_in
    i2s_lrclk_pin:
      number: GPIO13
      allow_other_uses: true
    i2s_bclk_pin:
      number: GPIO18
      allow_other_uses: true

microphone:
  - platform: i2s_audio
    id: spike_mic
    i2s_audio_id: i2s_in
    i2s_din_pin: GPIO17
    adc_type: external
    channel: left
    sample_rate: 48000
    bits_per_sample: 32bit
    on_data:
      - lambda: |-
          // Log mic data to prove microphone receives data while speaker is active.
          // First 10 callbacks detailed, then every 50th for continuous monitoring.
          static int count = 0;
          static uint32_t total_bytes = 0;
          count++;
          total_bytes += x.size();
          if (count <= 10 || count % 50 == 0) {
            ESP_LOGI("spike", "Mic callback #%d: %d bytes (total: %u)",
                     count, x.size(), total_bytes);
          }

speaker:
  - platform: i2s_audio
    id: spike_speaker
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO12
    dac_type: external
    channel: left
    sample_rate: 48000
    bits_per_sample: 32bit
    buffer_duration: 100ms

rtttl:
  id: spike_buzzer
  speaker: spike_speaker

# DAC unmute (active low on Onju Voice PCB)
output:
  - platform: gpio
    id: dac_mute
    pin:
      number: GPIO21
      inverted: true

switch:
  - platform: output
    id: dac_mute_switch
    name: "DAC Mute"
    output: dac_mute
    restore_mode: ALWAYS_OFF
